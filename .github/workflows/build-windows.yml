name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          # GUI libs mocked; install core extras used in unit tests
          pip install pyttsx3 || true
      - name: Unit tests
        run: pytest -q

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build exe + installer
        shell: pwsh
        run: ./installer/build_windows.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCAgent-Windows
          path: |
            dist/PCAgent-Setup.exe
            dist/PCAgent/**
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          name: PC Agent ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/PCAgent-Setup.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
