[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-agent"
version = "1.0.5"
description = "Always-on Windows desktop agent with Gemini brain and full PC control"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pedro" }]
dependencies = [
  "google-genai>=1.0.0",
  "keyring>=25.0.0",
  "Pillow>=10.0.0",
  "mss>=9.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "apscheduler>=3.10.4",
  "pyperclip>=1.9.0",
  "psutil>=5.9.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
desktop = [
  "pystray>=0.19.5",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pynput>=1.7.6",
]
windows = [
  "pywin32>=306",
  "pyttsx3>=2.90",
  "sounddevice>=0.4.6",
  "pystray>=0.19.5",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pynput>=1.7.6",
]
voice = ["pyttsx3>=2.90", "sounddevice>=0.4.6", "numpy>=1.26"]
browser = ["playwright>=1.40.0"]

[project.scripts]
pc-agent = "pc_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
